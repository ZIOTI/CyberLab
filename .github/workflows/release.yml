name: Release CyberRange PRO (Automatique)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🧪 Exécution de la suite de tests de validation
        run: npm run test:all

      - name: 🔨 Compilation des exécutables Windows (.EXE)
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Write-Host "[*] Compilation de CyberRange-PRO.exe (Launcher)..."
          & $csc /nologo /target:winexe /out:CyberRange-PRO.exe /r:System.Windows.Forms.dll,System.Drawing.dll src-launcher\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compilation du launcher échouée' }

          Write-Host "[*] Compilation de CyberRange-PRO-Setup.exe (Installateur 1-Clic)..."
          & $csc /nologo /target:winexe /out:CyberRange-PRO-Setup.exe /r:System.Windows.Forms.dll,System.Drawing.dll,Microsoft.CSharp.dll,System.IO.Compression.dll,System.IO.Compression.FileSystem.dll src-launcher\Installer.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compilation de l’installateur échouée' }

      - name: 📦 Préparation des packages de distribution
        shell: powershell
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $versionTag = "v" + $pkg.version

          New-Item -ItemType Directory -Force -Path dist\CyberRange-PRO | Out-Null

          # Copie des fichiers d'application propres
          Copy-Item -Recurse -Force public dist\CyberRange-PRO\
          Copy-Item -Recurse -Force challenges dist\CyberRange-PRO\
          Copy-Item -Recurse -Force platform dist\CyberRange-PRO\
          Copy-Item -Recurse -Force docs dist\CyberRange-PRO\
          Copy-Item -Recurse -Force scripts dist\CyberRange-PRO\
          Copy-Item -Recurse -Force .github dist\CyberRange-PRO\
          Copy-Item -Force test_suite.js, test_flags.js, test_edge_cases_phase3.js, test_edge_cases_phase4.js, test_edge_cases_phase5.js dist\CyberRange-PRO\
          Copy-Item -Force CyberRange-PRO.exe dist\CyberRange-PRO\
          Copy-Item -Force CyberRange-PRO-Setup.exe dist\CyberRange-PRO\
          Copy-Item -Force server.js dist\CyberRange-PRO\
          Copy-Item -Force package.json dist\CyberRange-PRO\
          Copy-Item -Force start.bat dist\CyberRange-PRO\
          Copy-Item -Force update.bat dist\CyberRange-PRO\
          Copy-Item -Force start.sh dist\CyberRange-PRO\
          Copy-Item -Force update.sh dist\CyberRange-PRO\
          Copy-Item -Force updater.js dist\CyberRange-PRO\
          Copy-Item -Force README.md dist\CyberRange-PRO\
          Copy-Item -Force LICENSE dist\CyberRange-PRO\
          Copy-Item -Force CONTRIBUTING.md dist\CyberRange-PRO\
          Copy-Item -Force SECURITY.md dist\CyberRange-PRO\
          Copy-Item -Force CODE_OF_CONDUCT.md dist\CyberRange-PRO\

          # Suppression explicite de toute base locale temporaire
          Remove-Item -Force -ErrorAction SilentlyContinue dist\CyberRange-PRO\cyberrange.db*
          Remove-Item -Force -ErrorAction SilentlyContinue dist\CyberRange-PRO\targets.db*

          # Création du ZIP portable
          Compress-Archive -Path dist\CyberRange-PRO\* -DestinationPath dist\CyberRange-PRO.zip -Force
          Copy-Item -Force dist\CyberRange-PRO.zip "dist\CyberRange-PRO-$versionTag.zip"

          # Copie de l'installateur autonome dans dist/
          Copy-Item -Force CyberRange-PRO-Setup.exe dist\

          # Génération automatique du fichier de contrôle d'intégrité SHA-256 (checksums.txt)
          Get-FileHash -Algorithm SHA256 dist\CyberRange-PRO-Setup.exe, dist\CyberRange-PRO.zip, "dist\CyberRange-PRO-$versionTag.zip" | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii dist\checksums.txt

          # Enregistre la version pour les steps suivants
          "RELEASE_TAG=$versionTag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($pkg.version)" >> $env:GITHUB_ENV

      - name: 🚀 Création automatique de la GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: "CyberRange PRO ${{ env.RELEASE_TAG }} (Installer & Portable)"
          generate_release_notes: true
          body_path: docs/RELEASE-v1.4.0.md
          draft: false
          prerelease: false
          files: |
            dist/CyberRange-PRO-Setup.exe
            dist/CyberRange-PRO.zip
            dist/CyberRange-PRO-*.zip
            dist/checksums.txt
